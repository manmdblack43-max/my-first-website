<title>CURRENCY</title>
<style>
:root{--bg:#fff;--fg:#111;--muted:#666;--line:#d8d8d8;--soft:#f3f3f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}
header{padding:16px 12px 8px;margin-bottom:38px;text-align:center;background:#d90000;color:#fff;border-bottom:1px solid #b80000;position:relative}
h1{font-size:27px;letter-spacing:3px;margin:0;font-weight:850}
.lang-switch{position:absolute;right:0;bottom:-35px;display:flex;gap:4px;z-index:2}
.lang-switch button{font-size:11px;padding:5px 7px;border:1px solid #d90000;border-radius:6px;background:#fff;color:#c00;line-height:1.2}
.lang-switch button.active{background:#d90000;color:#fff}
.pill.active-from{background:#0878e8;color:#fff;border-color:#0878e8}
.pill.active-to{background:#d90000;color:#fff;border-color:#d90000}
.country-option.selected-from{background:#0878e8;color:#fff}
.country-option.selected-to{background:#d90000;color:#fff}
main{max-width:560px;margin:auto;padding:18px 14px 30px}
.section-label{font-size:14px;font-weight:700;margin:17px 0 8px}
.search-wrap{position:relative}
.search{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:white;color:#111;font-size:15px;outline:none}
.search:focus,.amount:focus{border-color:#111}
.pills{display:flex;gap:7px;overflow-x:auto;padding:8px 1px 10px;scrollbar-width:thin;white-space:nowrap}
.pill{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#111;border-radius:9px;padding:7px 10px;font-size:13px;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.country-list{display:none;max-height:190px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-top:5px}
.country-list.show{display:block}
.country-option{padding:10px 12px;border-bottom:1px solid #eee;font-size:14px}
.country-option:last-child{border-bottom:0}
.country-option:active{filter:brightness(.95)}
.amount{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:22px;font-weight:650;color:#111;background:#fff;outline:none}
.result{margin-top:22px;border:1px solid var(--line);border-radius:15px;padding:22px 14px;text-align:center;min-height:96px;display:flex;align-items:center;justify-content:center;overflow-wrap:anywhere}
.result-value{font-size:32px;font-weight:800;letter-spacing:.2px}
.note{font-size:12px;color:var(--muted);text-align:center;line-height:1.5;margin:13px 6px}
.status{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
button{cursor:pointer}
</style>
</head>

 const el=document.getElementById(id); el.innerHTML="";
 codes.forEach(code=>{
   const b=document.createElement("button"); b.className="pill"+(code===selected?(id==="fromPills"?" active-from":" active-to"):"");
   b.textContent=(language==="bn"?(bnCountries[nameFor(code)]||nameFor(code)):nameFor(code))+" · "+code; b.title=nameFor(code);
   b.onclick=()=>choose(code); el.appendChild(b);
 });
}
function render(){
 makePills("fromPills",commonFrom,fromCode,c=>{fromCode=c;document.getElementById("fromSearch").value="";render();calculate()});
 makePills("toPills",commonTo,toCode,c=>{toCode=c;document.getElementById("toSearch").value="";render();calculate()});
}
function setupSearch(inputId,listId,side){
 const input=document.getElementById(inputId), list=document.getElementById(listId);
 function show(){
   const q=input.value.trim().toLowerCase();
   const found=countries.filter(c=>!q || c[0].toLowerCase().includes(q)||c[1].toLowerCase().includes(q)||(bnCountries[c[0]]||"").toLowerCase().includes(q)).slice(0,70);
   list.innerHTML="";
   found.forEach(c=>{
     const d=document.createElement("div"); d.className="country-option"; d.dataset.country=c[0]; d.dataset.code=c[1]; if(c[1]=== (side==="from"?fromCode:toCode)) d.classList.add(side==="from"?"selected-from":"selected-to"); d.textContent=(language==="bn"?(bnCountries[c[0]]||c[0]):c[0])+" · "+c[1];
     d.onclick=()=>{if(side==="from")fromCode=c[1];else toCode=c[1];input.value=(language==="bn"?(bnCountries[c[0]]||c[0]):c[0])+" · "+c[1];list.classList.remove("show");render();calculate()};
     list.appendChild(d);
   });
   list.classList.toggle("show",true);
 }
 input.addEventListener("focus",show); input.addEventListener("input",show);
 // দ্বিতীয়বার খালি সার্চ বক্সে ট্যাপ করলে তালিকা ও কিবোর্ড বন্ধ হবে
 input.addEventListener("pointerdown",e=>{
   if(document.activeElement===input && list.classList.contains("show") && input.value.trim()===""){
     e.preventDefault(); list.classList.remove("show"); input.blur();
   }
 });
 document.addEventListener("click",e=>{if(!e.target.closest("#"+inputId)&&!e.target.closest("#"+listId))list.classList.remove("show")});
}
function formatNumber(n){
 if(!Number.isFinite(n)) return "—";
 return n.toLocaleString("en-US",{maximumFractionDigits:6,minimumFractionDigits:0,useGrouping:false});
}
function calculate(){
 const amount=Number(document.getElementById("amount").value);
 const result=document.getElementById("result");
 if(document.getElementById("amount").value===""||!Number.isFinite(amount)){result.textContent="—";return}
 if(fromCode===toCode){result.textContent=formatNumber(amount);return}
 if(rates && rates[fromCode] && rates[toCode]){
   result.textContent=formatNumber(amount*rates[toCode]/rates[fromCode]);
 } else {
   result.textContent="—";
 }
}
document.getElementById("amount").addEventListener("input",calculate);
setupSearch("fromSearch","fromList","from");setupSearch("toSearch","toList","to");
render();calculate();
async function loadRates(){
 try{
   const res=await fetch("https://open.er-api.com/v6/latest/USD?cacheBust="+Date.now(),{cache:"no-store"});
   if(!res.ok) throw new Error("network");
   const data=await res.json();
   if(data.result!=="success"||!data.rates||!data.rates.USD) throw new Error("rates");
   rates=data.rates;
   calculate();
 }catch(e){
   rates=null;
   calculate();
 }
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")loadRates()});
loadRates();
</script>
